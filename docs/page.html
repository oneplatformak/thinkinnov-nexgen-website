<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirect</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=about.html">
  <script>(()=>{const p=new URLSearchParams(location.search).get('page')||'about';const map={about:'about.html',plm:'plm.html',services:'services.html','digital-transformation':'digital-transformation.html',products:'products.html',solutions:'solutions.html',industries:'industries.html','behind-the-brand':'behind-the-brand.html',careers:'careers.html'};const t=map[p]||'about.html';const h=location.hash||'';location.replace(t+h);const a=document.getElementById('fallback');if(a)a.href=t+h;})();</script>
</head>
<body>
  <h1 style="position:absolute;left:-9999px">Redirecting</h1>
  <p>Redirecting… If nothing happens, <a id="fallback" href="about.html">continue here</a>.</p>
</body>
</html>
